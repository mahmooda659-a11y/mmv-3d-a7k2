<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#141210">
<title>360° Tour</title>

<!--
  ═══════════════════════════════════════════════════════════════
  FSM JAYAPENA & CO. — 360° TOUR
  Engine: Photo Sphere Viewer 5 (panorama, transitions, map)
  Interface: built here, so every pixel is ours.

  One file. Reads views.js. Needs internet on first open.
  Shift+E opens authoring mode.
  ═══════════════════════════════════════════════════════════════
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/map-plugin@5/index.min.css">

<style>
  :root{
    --ink:#141210; --ink2:#1F1C18; --clay:#8A3B2B; --clay-hi:#A84733;
    --paper:#F2EFE9; --dim:rgba(242,239,233,.58); --line:rgba(242,239,233,.16);
    --psv-loader-color:#8A3B2B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--paper);-webkit-font-smoothing:antialiased;font-size:14px}
  #stage{position:fixed;inset:0}
  button{font:inherit;cursor:pointer}
  .psv-container{background:var(--ink)}
  .psv-map{border:1px solid var(--line)!important;box-shadow:0 8px 30px rgba(0,0,0,.55)!important}

  /* ═══ masthead ═══════════════════════════════════════ */
  #hdr{position:fixed;top:0;left:0;right:0;z-index:40;padding:16px 20px 40px;
    pointer-events:none;background:linear-gradient(180deg,rgba(20,18,16,.72),transparent);
    transition:opacity .4s}
  .fm{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .fm b{color:var(--clay)}
  .pj{margin-top:4px;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .mob{display:none;margin-top:3px;font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--dim)}
  .mob b{color:var(--paper);font-weight:650;letter-spacing:.03em}
  .mob span{margin-left:9px;font-variant-numeric:tabular-nums}
  #logo{position:fixed;top:16px;right:20px;z-index:40;max-width:180px;max-height:56px;
    pointer-events:none;opacity:.94;transition:opacity .4s}
  #logo[hidden]{display:none}

  /* ═══ hotspots ═══════════════════════════════════════ */
  #spots{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .hs{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    filter:drop-shadow(0 3px 12px rgba(0,0,0,.65));transition:opacity .2s}
  .hs .lbl{font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap;
    background:rgba(20,18,16,.7);padding:3px 10px;border-radius:2px;transition:background .2s}

  /* navigation — two chevrons stepping forward inside a ring */
  .hs.nav .ring{position:relative;width:46px;height:46px;border-radius:50%;
    border:1.5px solid rgba(242,239,233,.55);background:rgba(20,18,16,.2);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:background .22s,border-color .22s,transform .22s}
  .hs.nav .ring::before{content:"";position:absolute;inset:-1.5px;border-radius:50%;
    border:1.5px solid rgba(242,239,233,.85);
    clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%);
    animation:sweep 2.8s linear infinite}
  .hs.nav .ring svg{width:26px;height:16px;fill:none;stroke:#F2EFE9;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}
  .hs.nav .ring svg path:nth-child(1){animation:step 1.9s ease-in-out infinite}
  .hs.nav .ring svg path:nth-child(2){animation:step 1.9s ease-in-out .28s infinite}
  .hs.nav:hover .ring{background:var(--clay);border-color:var(--clay);transform:scale(1.1)}
  @keyframes step{0%,100%{opacity:.35;transform:translateX(-2px)}
    45%{opacity:1;transform:translateX(2px)}}
  @keyframes sweep{to{transform:rotate(360deg)}}

  /* info — filled disc with an orbiting arc */
  .hs.info .ring{position:relative;width:38px;height:38px;border-radius:50%;
    background:var(--clay);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px rgba(138,59,43,.22);transition:background .22s,transform .22s}
  .hs.info .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1.5px solid rgba(242,239,233,.72);border-right-color:transparent;
    border-bottom-color:transparent;animation:orbit 3.4s linear infinite}
  .hs.info .ring svg{width:17px;height:17px;fill:none;stroke:#F2EFE9;stroke-width:2.4;
    stroke-linecap:round}
  .hs.info:hover .ring{background:var(--clay-hi);transform:scale(1.12)}
  @keyframes orbit{to{transform:rotate(360deg)}}

  .hs:hover .lbl{background:rgba(138,59,43,.92)}
  @media(prefers-reduced-motion:reduce){
    .hs .ring::before,.hs.nav .ring svg path{animation:none!important}}

  /* ═══ bottom bar ═════════════════════════════════════ */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:linear-gradient(0deg,rgba(20,18,16,.93),rgba(20,18,16,.62) 72%,transparent);
    padding:26px 16px 12px;transition:transform .35s ease,opacity .35s ease}
  #bar.tucked{transform:translateY(calc(100% - 4px));opacity:0}
  #cap{display:flex;align-items:baseline;gap:10px;padding:0 4px 8px;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  #cap b{color:var(--paper);font-weight:600;letter-spacing:.04em}
  #cap .sp{flex:1}
  #prog{font-variant-numeric:tabular-nums;white-space:nowrap}
  #strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  #strip::-webkit-scrollbar{height:3px}
  #strip::-webkit-scrollbar-thumb{background:rgba(242,239,233,.22)}
  .th{flex:none;width:104px;border:1px solid transparent;border-radius:2px;overflow:hidden;
    background:none;padding:0;text-align:left;position:relative}
  .th .im{height:52px;background:#26221E;overflow:hidden}
  .th img{width:100%;height:100%;object-fit:cover;opacity:.6;transition:opacity .2s}
  .th em{display:block;font-style:normal;font-size:10px;padding:4px 4px 3px;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .th:hover img{opacity:.9}
  .th.on{border-color:var(--clay)}
  .th.on img{opacity:1}
  .th.on em{color:var(--paper);font-weight:600}
  .th .tick{position:absolute;top:4px;right:4px;width:15px;height:15px;border-radius:50%;
    background:rgba(20,18,16,.72);display:none;align-items:center;justify-content:center}
  .th.seen .tick{display:flex}
  .th .tick svg{width:9px;height:9px;fill:none;stroke:#7FB07F;stroke-width:3;
    stroke-linecap:round;stroke-linejoin:round}
  #tools{display:flex;align-items:center;gap:5px;padding-top:8px}
  #tools .sp{flex:1}
  #tAudio svg #w1,#tAudio svg #w2{opacity:.25;transition:opacity .25s}
  #tAudio.on svg #w1{opacity:1;animation:wave 1.8s ease-in-out infinite}
  #tAudio.on svg #w2{opacity:1;animation:wave 1.8s ease-in-out .35s infinite}
  @keyframes wave{0%,100%{opacity:.35}50%{opacity:1}}
  .tool{width:32px;height:32px;border:1px solid transparent;background:none;border-radius:2px;
    color:var(--dim);display:flex;align-items:center;justify-content:center;transition:all .18s}
  .tool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .tool:hover{color:var(--paper);background:rgba(242,239,233,.12)}
  .tool.on{color:var(--clay);border-color:var(--line)}
  #tSound .wave1,#tSound .wave2{opacity:.25;transition:opacity .25s}
  #tSound.on .wave1{opacity:1}
  #tSound.on .wave2{opacity:1;animation:waveOut 2.4s ease-in-out infinite}
  @keyframes waveOut{0%,100%{opacity:.35}50%{opacity:1}}
  .tool[hidden]{display:none}
  #tuck{position:fixed;left:50%;transform:translateX(-50%);bottom:4px;z-index:46;
    width:44px;height:20px;border:none;background:rgba(20,18,16,.8);border-radius:2px 2px 0 0;
    color:var(--dim);display:flex;align-items:center;justify-content:center}
  #tuck:hover{color:var(--paper)}
  #tuck svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
  body.tucked #tuck svg{transform:rotate(180deg)}
  body.tucked #hdr,body.tucked #logo{opacity:0}

  /* ═══ overlays: grid, info, material ═════════════════ */
  .sheet{position:fixed;inset:0;z-index:120;background:rgba(20,18,16,.94);
    display:none;flex-direction:column;padding:26px 24px}
  .sheet.on{display:flex}
  .sheet h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);
    font-weight:700;margin-bottom:16px}
  .sheet .x{position:absolute;top:20px;right:22px;width:34px;height:34px;border:1px solid var(--line);
    background:none;color:var(--paper);border-radius:2px;font-size:17px;line-height:1}
  .sheet .x:hover{background:var(--clay);border-color:var(--clay)}
  #gridWrap{overflow-y:auto;display:flex;flex-direction:column;gap:22px}
  .ggroup h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    font-weight:600;margin-bottom:10px}
  .gitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .gcard{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:none;
    padding:0;text-align:left;position:relative;transition:border-color .18s}
  .gcard .im{height:112px;background:#26221E;overflow:hidden}
  .gcard img{width:100%;height:100%;object-fit:cover;opacity:.8;transition:opacity .2s}
  .gcard span{display:block;padding:8px 10px;font-size:12.5px;font-weight:600}
  .gcard:hover{border-color:var(--clay)}
  .gcard:hover img{opacity:1}
  .gcard.seen::after{content:"✓";position:absolute;top:7px;right:9px;color:#7FB07F;
    font-size:13px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8)}

  #infoBody{overflow-y:auto;max-width:64ch;line-height:1.75;color:rgba(242,239,233,.86)}
  #infoBody p{margin-bottom:13px}
  #infoBody h4{font-size:13px;margin:18px 0 7px;color:var(--paper)}

  /* material card slides in from the right */
  #matScrim{position:fixed;inset:0;z-index:128;background:rgba(20,18,16,.5);display:none}
  #matScrim.on{display:block}
  #mat{position:fixed;top:0;right:0;bottom:0;width:min(390px,88vw);z-index:130;
    background:var(--ink2);border-left:1px solid var(--line);padding:24px;overflow-y:auto;
    transform:translateX(102%);transition:transform .38s cubic-bezier(.4,0,.2,1)}
  #mat.on{transform:none}
  #mat .x{position:absolute;top:16px;right:18px;width:30px;height:30px;border:1px solid var(--line);
    background:none;color:var(--paper);border-radius:2px}
  #mat .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);font-weight:700}
  #mat h3{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:6px 0 14px}
  #mat img{width:100%;border-radius:2px;margin-bottom:14px;display:block}
  #mat img[hidden]{display:none}
  #mat p{line-height:1.72;color:rgba(242,239,233,.84);margin-bottom:11px}
  #mat dl{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;font-size:13px}
  #mat dt{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:11px}
  #mat dd{margin-top:3px}
  #mat dd a{color:#C58A79;word-break:break-all}
  #mat .code{display:inline-block;border:1px solid var(--line);padding:2px 7px;border-radius:2px;
    font-size:10.5px;letter-spacing:.12em;color:var(--paper);margin-right:7px}
  #mat .chip{display:inline-block;padding:2px 8px;border-radius:2px;font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .chip.confirmed{background:rgba(127,176,127,.18);color:#8FC08F}
  .chip.verify{background:rgba(214,160,74,.18);color:#D6A04A}
  .chip.na{background:rgba(242,239,233,.1);color:var(--dim)}
  #mat .foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11px;line-height:1.6;color:rgba(242,239,233,.42)}

  /* ═══ the arrival ════════════════════════════════════ */
  #cover{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;
    background:var(--ink);transition:opacity 1s ease}
  #coverImg{max-width:100%;max-height:74vh;object-fit:contain;border-radius:2px;
    opacity:0;animation:rise 1.2s .1s forwards}
  #coverImg[hidden]{display:none}
  /* When a cover photograph is supplied it already carries the
     titles, so the typographic block steps aside.              */
  #cover.photo{justify-content:flex-end;padding-bottom:4vh}
  #cover.photo .rule,#cover.photo h1,#cover.photo .client,#cover.photo #coverLogo{display:none}
  #cover.photo .count{color:rgba(255,255,255,.8);text-shadow:0 1px 8px rgba(0,0,0,.7)}
  #cover.photo #start{box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #cover.gone{opacity:0;pointer-events:none}
  #cover img{max-width:min(340px,72vw);max-height:110px;margin-bottom:6px;
    opacity:0;animation:rise 1.1s .15s forwards}
  #cover img[hidden]{display:none}
  #cover .rule{width:42px;height:2px;background:var(--clay);opacity:0;animation:rise .9s .3s forwards}
  #cover h1{font-size:clamp(24px,5vw,36px);font-weight:650;letter-spacing:-.02em;line-height:1.18;
    opacity:0;animation:rise 1s .45s forwards}
  #cover .client{font-size:12.5px;color:var(--dim);max-width:38ch;
    opacity:0;animation:rise 1s .6s forwards}
  #cover .count{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(242,239,233,.36);opacity:0;animation:rise 1s .75s forwards}
  #start{border:none;background:var(--clay);color:var(--paper);font-size:13.5px;font-weight:600;
    padding:13px 34px;border-radius:3px;opacity:0;animation:rise 1s .9s forwards;
    transition:background .2s}
  #start:hover{background:var(--clay-hi)}
  #cover .fail{color:#E0876F;font-size:13px;line-height:1.6;max-width:46ch}
  @keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

  /* ═══ authoring ══════════════════════════════════════ */
  #author{position:fixed;top:0;right:0;bottom:0;width:340px;z-index:300;background:#0C0A09;
    border-left:1px solid var(--line);padding:18px;overflow-y:auto;display:none;
    flex-direction:column;gap:11px}
  #author.on{display:flex}
  #author h2{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);font-weight:700}
  #author p{font-size:12px;line-height:1.6;color:var(--dim)}
  #author textarea{width:100%;height:180px;background:#1A1715;color:var(--paper);font-size:11.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);
    border-radius:3px;padding:10px;line-height:1.6;resize:vertical}
  #author .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .mini{border:1px solid var(--line);background:rgba(242,239,233,.04);color:var(--paper);
    font-size:11px;padding:7px 11px;border-radius:2px}
  .mini:hover{background:rgba(242,239,233,.13)}
  .mini.on{background:var(--clay);border-color:var(--clay)}
  #northCal{width:100%;accent-color:var(--clay)}

  /* ═══ phones ═══════════════════════════════════════════
     The plan is summoned rather than parked, the caption
     moves into the masthead, and the strip shrinks so the
     panorama keeps most of the screen.                     */
  #planScrim{position:fixed;inset:0;z-index:148;background:rgba(20,18,16,.74);display:none}
  #tPlan{display:none}

  @media(max-width:760px){
    .pj{font-size:15px}
    .mob{display:block}
    #hdr{padding:12px 16px 30px}
    #logo{max-width:104px;max-height:34px;top:12px;right:16px}

    #tPlan{display:flex}
    .psv-map{display:none!important}
    body.plan-open #planScrim{display:block}
    body.plan-open .psv-map{display:block!important;position:fixed!important;
      left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;
      width:88vw!important;height:min(88vw,62vh)!important;max-width:none!important;
      max-height:none!important;margin:0!important;z-index:150!important}

    #bar{padding:20px 10px calc(8px + env(safe-area-inset-bottom))}
    #cap{display:none}
    #strip{gap:6px}
    .th{width:74px}
    .th .im{height:40px}
    .th em{font-size:9px;padding:3px 3px 2px}
    #tools{padding-top:6px;gap:2px}
    .tool{width:38px;height:34px}
    .tool svg{width:17px;height:17px}
    #tuck{width:52px;height:18px;bottom:calc(env(safe-area-inset-bottom))}

    .hs .lbl{font-size:10px;padding:2px 8px}
    .hs.nav .ring{width:42px;height:42px}
    .hs.info .ring{width:34px;height:34px}

    #mat{width:100%}
    .sheet{padding:20px 16px}
    .gitems{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
    .gcard .im{height:86px}
    #author{width:100%}
  }
  /* ═══ phone, held sideways ═══════════════════════════ */
  @media(max-height:520px) and (orientation:landscape){
    #hdr{padding:8px 14px 22px}
    .fm{font-size:9px}
    .pj{font-size:13px}
    .mob{font-size:10px}
    #bar{padding:14px 10px calc(6px + env(safe-area-inset-bottom))}
    .th{width:64px}
    .th .im{height:32px}
    .th em{display:none}
    #tools{padding-top:4px}
    .tool{width:34px;height:28px}
    #coverImg{max-height:52vh}
    #cover.photo{gap:12px;padding:14px}
    #start{padding:10px 24px}
    .sheet{padding:14px 16px}
    .gcard .im{height:66px}
  }

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="stage"></div>
<audio id="amb" loop preload="none"></audio>
<div id="spots"></div>

<div id="hdr">
  <div class="fm">FSM Jayapena <b>&amp;</b> Co.</div>
  <div class="pj" id="pj"></div>
  <div class="mob" id="mobLine"><b id="mobView"></b><span id="mobProg"></span></div>
</div>
<img id="logo" alt="" hidden>

<button id="tuck" title="Hide panel"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>

<div id="bar">
  <div id="cap"><b id="capView"></b><span id="capGroup"></span><span class="sp"></span><span id="prog"></span></div>
  <div id="strip"></div>
  <div id="tools">
    <button class="tool" id="tHome" title="First view"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></svg></button>
    <button class="tool" id="tBack" title="Back" hidden><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
    <button class="tool" id="tPlan" title="Floor plan"><svg viewBox="0 0 24 24"><path d="M3 4h18v16H3z"/><path d="M3 11h7V4M10 20v-5h11"/></svg></button>
    <button class="tool" id="tGrid" title="All views"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
    <button class="tool" id="tInfo" title="About this project"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg></button>
    <span class="sp"></span>
    <button class="tool" id="tSound" title="Ambient sound" hidden><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7" class="wave1"/><path d="M18.5 5.5a9 9 0 010 13" class="wave2"/></svg></button>
    <button class="tool" id="tAudio" title="Ambient sound" hidden><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7" id="w1"/><path d="M18.5 5.5a9 9 0 010 13" id="w2"/></svg></button>
    <button class="tool" id="tSpin" title="Auto-rotate"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg></button>
    <button class="tool" id="tFull" title="Full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
  </div>
</div>

<div id="planScrim" hidden></div>

<div class="sheet" id="grid">
  <button class="x" id="gridX">×</button>
  <h2>All views</h2>
  <div id="gridWrap"></div>
</div>

<div class="sheet" id="info">
  <button class="x" id="infoX">×</button>
  <h2>About this project</h2>
  <div id="infoBody"></div>
</div>

<div id="matScrim" hidden></div>
<div id="mat">
  <button class="x" id="matX">×</button>
  <div class="k" id="matKind">Material</div>
  <h3 id="matTitle"></h3>
  <img id="matImg" alt="" hidden>
  <div id="matBody"></div>
  <dl id="matFacts"></dl>
</div>

<div id="cover">
  <img id="coverImg" alt="" hidden>
  <img id="coverLogo" alt="" hidden>
  <div class="rule"></div>
  <h1 id="ch">360° Tour</h1>
  <div class="client" id="cclient"></div>
  <div class="count" id="cc"></div>
  <button id="start">Enter the tour</button>
  <div class="fail" id="cf"></div>
</div>

<div id="author">
  <h2>Authoring mode</h2>
  <p id="hint">Pick what you are placing, then click in the panorama.</p>
  <div class="row">
    <button class="mini on" id="mLink">Navigation link</button>
    <button class="mini" id="mSpot">Info hotspot</button>
  </div>
  <textarea id="out" readonly placeholder="Captured lines appear here."></textarea>
  <div class="row">
    <button class="mini" id="cpy">Copy</button>
    <button class="mini" id="clr">Clear</button>
    <button class="mini" id="cls">Close (Shift+E)</button>
  </div>
  <div style="border-top:1px solid rgba(242,239,233,.14);padding-top:11px">
    <p style="margin-bottom:7px">North: face something you can find on the plan,
       then drag until the map cone agrees. Release to apply.</p>
    <input type="range" id="northCal" min="0" max="359" value="0" step="1">
    <div class="row" style="margin-top:7px">
      <span style="font-size:12px;color:var(--dim)">north
        <b id="northVal" style="color:#F2EFE9;font-variant-numeric:tabular-nums">0</b>°</span>
      <button class="mini" id="northSave">Save line</button>
    </div>
  </div>
</div>

<audio id="amb" loop preload="none"></audio>

<script src="views.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
    "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5/index.module.js",
    "@photo-sphere-viewer/map-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/map-plugin@5/index.module.js",
    "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin@5/index.module.js"
  }
}
</script>

<script type="module">
import { Viewer }            from '@photo-sphere-viewer/core';
import { VirtualTourPlugin } from '@photo-sphere-viewer/virtual-tour-plugin';
import { MapPlugin }         from '@photo-sphere-viewer/map-plugin';
import { AutorotatePlugin }  from '@photo-sphere-viewer/autorotate-plugin';

const $ = id => document.getElementById(id);
const CFG = window.TOUR || {};
const V   = (CFG.views || []).slice();
const D2R = Math.PI / 180;

V.forEach((v, i) => { if (!v.id) v.id = 'v' + (i + 1); });

/* ── cover ─────────────────────────────────────────── */
$('pj').textContent      = CFG.project || '360° Tour';
$('ch').textContent      = CFG.project || '360° Tour';
$('cclient').textContent = CFG.client  || '';
$('cc').textContent      = V.length + ' views — 360°';
document.title           = (CFG.project || '360') + ' — 360° Tour';
if (CFG.cover) {
  $('coverImg').src = CFG.cover;
  $('coverImg').hidden = false;
  $('coverImg').onerror = () => {         /* fall back to the typographic cover */
    $('coverImg').hidden = true;
    $('cover').classList.remove('photo');
  };
  $('cover').classList.add('photo');
}
if (CFG.logo) {
  $('coverLogo').src = CFG.logo; $('coverLogo').hidden = false;
  $('logo').src      = CFG.logo; $('logo').hidden      = false;
}
if (!V.length) { $('cf').textContent = 'No views listed in views.js.'; $('start').disabled = true; }

/* ── state ─────────────────────────────────────────── */
let viewer, tour, map, spin;
let live = [];              /* on-screen hotspots */
let cur  = null;
const seen  = new Set();
const trail = [];

/* ── floor plan pixel size (pins are stored as fractions) ── */
function planSize() {
  return new Promise(res => {
    if (!CFG.plan || !CFG.plan.image) return res(null);
    const img = new Image();
    img.onload  = () => res({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => res(null);
    img.src = CFG.plan.image;
  });
}

/* ── build ─────────────────────────────────────────── */
async function build() {
  const size = await planSize();

  const nodes = V.map(v => {
    const n = { id: v.id, panorama: v.file, name: v.name, links: [] };
    if (typeof v.north === 'number' && v.north) n.sphereCorrection = { pan: (-v.north) + 'deg' };
    if (size) n.map = v.pin ? { x: Math.round(v.pin.x * size.w), y: Math.round(v.pin.y * size.h) } : false;
    return n;
  });

  const tourCfg = {
    dataMode: 'client', positionMode: 'manual', renderMode: '3d',
    nodes, startNodeId: V[0].id, preload: true,
    transitionOptions: { showLoader: true, speed: '20rpm', effect: 'fade', rotation: true },
  };
  if (size) tourCfg.map = { imageUrl: CFG.plan.image,
                            size: (CFG.plan.size || '280px'),
                            rotation: ((CFG.plan.rotation) || 0) + 'deg' };

  const plugins = [
    VirtualTourPlugin.withConfig(tourCfg),
    AutorotatePlugin.withConfig({ autostartOnIdle: false, autorotateSpeed: '0.8rpm' }),
  ];
  if (size) plugins.push(MapPlugin.withConfig({
    imageUrl: CFG.plan.image,
    center: { x: Math.round(size.w / 2), y: Math.round(size.h / 2) },
    rotation: ((CFG.plan.rotation) || 0) + 'deg',
    size: '250px', maxZoom: 300, minZoom: 5,
    defaultZoom: (CFG.plan.zoom != null ? CFG.plan.zoom : 20),
    shape: 'square', static: true,
    spotStyle: { size: 13, color: 'rgba(242,239,233,.7)', hoverSize: 17, hoverColor: '#F2EFE9' },
  }));

  viewer = new Viewer({
    container: $('stage'), navbar: false, loadingTxt: '',
    defaultZoomLvl: 35, maxFov: 95, minFov: 25,
    mousewheelCtrlKey: false, touchmoveTwoFingers: false, plugins,
  });

  tour = viewer.getPlugin(VirtualTourPlugin);
  map  = viewer.getPlugin(MapPlugin);
  spin = viewer.getPlugin(AutorotatePlugin);

  tour.addEventListener('node-changed', ({ node }) => onNode(node.id));
  ['position-updated', 'zoom-updated', 'size-updated', 'render']
    .forEach(e => viewer.addEventListener(e, place));

  viewer.addEventListener('ready', () => {
    const n = tour.getCurrentNode();
    if (n) onNode(n.id);
    spin.start();
    ['mousedown', 'touchstart', 'wheel', 'keydown'].forEach(e =>
      window.addEventListener(e, () => spin.stop(), { once: true }));
    setTimeout(() => spin.stop(), 9000);
  }, { once: true });

  buildStrip(); buildGrid(); buildInfo(); wireAuthoring();
}

/* ── when the room changes ─────────────────────────── */
function onNode(id) {
  cur = id;
  seen.add(id);
  if (trail[trail.length - 1] !== id) trail.push(id);
  const v = V.find(x => x.id === id) || {};
  $('capView').textContent  = v.name || '';
  $('capGroup').textContent = v.group ? '· ' + v.group : '';
  const prog = seen.size + '/' + V.length +
               '  (' + Math.round(seen.size / V.length * 100) + '%)';
  $('prog').textContent = prog;
  $('mobView').textContent = v.name || '';
  $('mobProg').textContent = prog;
  $('tBack').hidden = trail.length < 2;
  const nc = $('northCal');
  nc.value = (typeof v.north === 'number') ? v.north : 0;
  $('northVal').textContent = nc.value;
  drawSpots(id);
  markStrip();
  markGrid();
}

/* ── hotspots: navigation + info ───────────────────── */
/* A double chevron reads as "keep going this way", and the bob
   animation makes it findable without shouting.               */
const CHEV = '<svg viewBox="0 0 24 24"><path d="M6 13.5l6-6 6 6"/>' +
             '<path d="M6 19l6-6 6 6" opacity=".55"/></svg>';
const IBOX = '';   /* the info ring draws its own serif i in CSS */

function drawSpots(id) {
  $('spots').innerHTML = ''; live = [];
  const v = V.find(x => x.id === id);
  if (!v) return;

  (v.links || []).forEach(L => {
    const dest = V.find(x => x.id === L.to);
    if (!dest) { console.warn('[tour] unknown link target:', L.to); return; }
    add('nav', L.yaw, L.pitch ?? -6, L.label || dest.name, CHEV,
        () => tour.setCurrentNode(L.to));
  });

  (v.spots || []).forEach(S => {
    const M = S.mat ? (CFG.materials || {})[S.mat] : null;
    const label = S.title || (M && M.title) || S.mat || 'Detail';
    add('info', S.yaw, S.pitch ?? 0, label, IBOX, () => openMat(S));
  });
}

function add(kind, yaw, pitch, label, icon, onclick) {
  const el = document.createElement('div');
  el.className = 'hs ' + kind;
  el.innerHTML = '<span class="lbl">' + label + '</span><span class="ring">' + icon + '</span>';
  el.onclick = onclick;
  $('spots').appendChild(el);
  live.push({ el, yaw: (yaw || 0) * D2R, pitch: (pitch || 0) * D2R });
  place();
}

function place() {
  if (!live.length || !viewer) return;
  const cam = viewer.getPosition();
  live.forEach(h => {
    const cosA = Math.sin(h.pitch) * Math.sin(cam.pitch) +
                 Math.cos(h.pitch) * Math.cos(cam.pitch) * Math.cos(h.yaw - cam.yaw);
    if (cosA < 0.12) { h.el.style.opacity = '0'; h.el.style.pointerEvents = 'none'; return; }
    let p; try { p = viewer.dataHelper.sphericalCoordsToViewerCoords({ yaw: h.yaw, pitch: h.pitch }); }
    catch (e) { return; }
    if (!p) return;
    h.el.style.left = p.x + 'px'; h.el.style.top = p.y + 'px';
    h.el.style.opacity = '1'; h.el.style.pointerEvents = 'auto';
  });
}

/* ── material / detail card ────────────────────────── */
const LIB = CFG.materials || {};

/* The strip and the grid must never pull full panoramas on a
   phone. If a thumbs folder is named, small copies are used —
   same filenames, so nothing has to be renamed or listed.   */
function thumbOf(v) {
  if (v.thumb) return v.thumb;
  if (CFG.thumbFolder) return CFG.thumbFolder.replace(/\/?$/, '/') + v.file;
  return v.file;
}

function openMat(S) {
  /* A spot either names a material code or carries its own text. */
  const M = S.mat ? (LIB[S.mat] || {}) : {};
  const d = { ...M, ...S };          /* anything written on the spot wins */

  $('matKind').innerHTML = (S.mat ? '<span class="code">' + S.mat + '</span>' : '') +
                           (d.zone || d.kind || 'Detail');
  $('matTitle').textContent = d.title || d.name || '';

  if (d.image) { $('matImg').src = d.image; $('matImg').hidden = false; }
  else $('matImg').hidden = true;

  $('matBody').innerHTML = (d.body || d.desc || '')
    .split('\n').filter(Boolean).map(t => '<p>' + t + '</p>').join('');

  const rows = [];
  if (d.appears)  rows.push(['Appears on', d.appears]);
  if (d.supplier) rows.push(['Supplier', d.supplier]);
  if (d.loc)      rows.push(['Location', d.loc]);
  if (d.contact)  rows.push(['Contact', d.contact]);
  if (d.ref)      rows.push(['Product reference', d.ref +
      (d.link ? '<br><a href="https://' + d.link.replace(/^https?:\/\//, '') +
                '" target="_blank" rel="noopener">' + d.link + '</a>' : '')]);
  if (d.status)   rows.push(['Status',
      '<span class="chip ' + d.status.toLowerCase().replace(/[^a-z]/g, '') + '">' +
      d.status + '</span>']);
  Object.entries(d.facts || {}).forEach(([k, v]) => rows.push([k, v]));

  $('matFacts').innerHTML = rows.map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('') +
    (d.supplier ? '<div class="foot">Supplier references are researched from public sources ' +
                  'and must be confirmed by quotation. Materials are indicative of colour and ' +
                  'texture; final selection is subject to sample approval.</div>' : '');

  $('mat').classList.add('on');
  $('matScrim').classList.add('on');
}
function closeMat(){ $('mat').classList.remove('on'); $('matScrim').classList.remove('on'); }
$('matX').onclick = closeMat;
$('matScrim').onclick = closeMat;

/* ── thumbnail strip ───────────────────────────────── */
function buildStrip() {
  const box = $('strip'); box.innerHTML = '';
  V.forEach(v => {
    const b = document.createElement('button');
    b.className = 'th'; b.dataset.id = v.id; b.title = v.name;
    b.innerHTML = '<div class="im"><img loading="lazy" decoding="async" src="' + thumbOf(v) + '" alt=""></div>' +
      '<div class="tick"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>' +
      '<em>' + v.name + '</em>';
    b.onclick = () => tour.setCurrentNode(v.id);
    box.appendChild(b);
  });
}
function markStrip() {
  [...$('strip').children].forEach(b => {
    b.classList.toggle('on', b.dataset.id === cur);
    b.classList.toggle('seen', seen.has(b.dataset.id));
    if (b.dataset.id === cur) b.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
}

/* ── grid of every view ────────────────────────────── */
function buildGrid() {
  const wrap = $('gridWrap'); wrap.innerHTML = '';
  const groups = [];
  V.forEach(v => { if (!groups.includes(v.group)) groups.push(v.group); });
  groups.forEach(g => {
    const sec = document.createElement('div'); sec.className = 'ggroup';
    sec.innerHTML = '<h3>' + (g || 'Views') + '</h3>';
    const items = document.createElement('div'); items.className = 'gitems';
    V.filter(v => v.group === g).forEach(v => {
      const c = document.createElement('button');
      c.className = 'gcard'; c.dataset.id = v.id;
      c.innerHTML = '<div class="im"><img loading="lazy" decoding="async" src="' + thumbOf(v) +
                    '" alt=""></div><span>' + v.name + '</span>';
      c.onclick = () => { $('grid').classList.remove('on'); tour.setCurrentNode(v.id); };
      items.appendChild(c);
    });
    sec.appendChild(items); wrap.appendChild(sec);
  });
}
function markGrid() {
  [...document.querySelectorAll('.gcard')]
    .forEach(c => c.classList.toggle('seen', seen.has(c.dataset.id)));
}

/* ── project info sheet ────────────────────────────── */
function buildInfo() {
  const src = CFG.info || 'No project notes have been added yet.';
  $('infoBody').innerHTML = src.split('\n').filter(Boolean).map(line =>
    line.startsWith('# ') ? '<h4>' + line.slice(2) + '</h4>' : '<p>' + line + '</p>').join('');
}

/* ── toolbar ───────────────────────────────────────── */
$('tHome').onclick = () => tour.setCurrentNode(V[0].id);
$('tBack').onclick = () => { if (trail.length < 2) return; trail.pop(); tour.setCurrentNode(trail.pop()); };
$('tPlan').onclick = () => {
  const open = document.body.classList.toggle('plan-open');
  $('tPlan').classList.toggle('on', open);
};
$('planScrim').onclick = () => {
  document.body.classList.remove('plan-open');
  $('tPlan').classList.remove('on');
};
$('tGrid').onclick = () => $('grid').classList.add('on');
$('gridX').onclick = () => $('grid').classList.remove('on');
$('tInfo').onclick = () => $('info').classList.add('on');
$('infoX').onclick = () => $('info').classList.remove('on');
/* Ambient sound. Browsers block audio until the visitor has
   clicked something — entering the tour counts as that click. */
const amb = $('amb');
let ambFade = null;
if (CFG.audio) {
  amb.src = CFG.audio;
  amb.volume = 0;
  $('tSound').hidden = false;
}
function fadeAudio(to, done) {
  clearInterval(ambFade);
  ambFade = setInterval(() => {
    const step = to > amb.volume ? 0.04 : -0.04;
    let v = amb.volume + step;
    if (v <= 0) { v = 0; clearInterval(ambFade); if (done) done(); }
    else if (v >= to && step > 0) { v = to; clearInterval(ambFade); }
    amb.volume = Math.min(1, Math.max(0, v));
  }, 45);
}
function soundOn(on) {
  $('tSound').classList.toggle('on', on);
  if (on) { amb.play().catch(() => {}); fadeAudio(CFG.audioVolume ?? 0.45); }
  else fadeAudio(0, () => amb.pause());
}
$('tSound').onclick = function () { soundOn(!this.classList.contains('on')); };

/* Ambient sound. Off by default — nobody wants a page that
   starts making noise at them. The label animates when live. */
if (CFG.audio) {
  const amb = $('amb');
  amb.src = CFG.audio;
  amb.volume = (typeof CFG.audioVolume === 'number') ? CFG.audioVolume : 0.35;
  $('tAudio').hidden = false;
  $('tAudio').onclick = function () {
    if (this.classList.contains('on')) { amb.pause(); this.classList.remove('on'); }
    else { amb.play().then(() => this.classList.add('on'))
                     .catch(e => console.warn('audio blocked:', e)); }
  };
}

$('tSpin').onclick = function () {
  const on = this.classList.toggle('on');
  on ? spin.start() : spin.stop();
};
$('tFull').onclick = () => document.fullscreenElement
  ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('tuck').onclick = () => {
  const t = document.body.classList.toggle('tucked');
  $('bar').classList.toggle('tucked', t);
};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    $('grid').classList.remove('on'); $('info').classList.remove('on');
    closeMat();
    document.body.classList.remove('plan-open'); $('tPlan').classList.remove('on');
  }
});

/* ── authoring ─────────────────────────────────────── */
function wireAuthoring() {
  let on = false, mode = 'link';
  const push = t => { const o = $('out'); o.value += (o.value ? '\n' : '') + t; o.scrollTop = 1e6; };

  window.addEventListener('keydown', e => {
    if (e.shiftKey && (e.key === 'E' || e.key === 'e')) {
      on = !on; $('author').classList.toggle('on', on); e.preventDefault();
    }
  });

  $('mLink').onclick = () => { mode = 'link'; $('mLink').classList.add('on');
    $('mSpot').classList.remove('on'); $('hint').textContent = 'Click the doorway you want to walk through.'; };
  $('mSpot').onclick = () => { mode = 'spot'; $('mSpot').classList.add('on');
    $('mLink').classList.remove('on'); $('hint').textContent = 'Click the material or feature you want to describe.'; };

  viewer.addEventListener('click', ({ data }) => {
    if (!on) return;
    let yaw = data.yaw * 180 / Math.PI; yaw = (yaw % 360 + 360) % 360;
    const pitch = data.pitch * 180 / Math.PI;
    const v = V.find(x => x.id === cur) || {};
    if (mode === 'link')
      push('        { to: "ID-HERE", yaw: ' + yaw.toFixed(1) + ', pitch: ' + pitch.toFixed(1) +
           ' },   /* from ' + (v.name || '') + ' */');
    else
      push('        { yaw: ' + yaw.toFixed(1) + ', pitch: ' + pitch.toFixed(1) +
           ', mat: "CODE" },   /* ' + (v.name || '') + ' */');
  });

  $('cpy').onclick = () => { $('out').select(); document.execCommand('copy'); };
  $('clr').onclick = () => { $('out').value = ''; };
  $('cls').onclick = () => { on = false; $('author').classList.remove('on'); };

  $('northCal').oninput  = function () { $('northVal').textContent = this.value; };
  $('northCal').onchange = function () {
    if (cur) tour.updateNode({ id: cur, sphereCorrection: { pan: (-this.value) + 'deg' } });
  };
  $('northSave').onclick = () => {
    const v = V.find(x => x.id === cur) || {};
    push('      north: ' + $('northCal').value + ',   /* ' + (v.name || '') + ' */');
  };
}

/* ── go ────────────────────────────────────────────── */
$('start').onclick = async () => {
  $('cover').classList.add('gone');
  setTimeout(() => { $('cover').style.display = 'none'; }, 1100);
  try {
    await build();
    if (CFG.audio && CFG.audioAutoplay) soundOn(true);
  }
  catch (err) {
    console.error('Tour failed to start:', err);
    $('cover').style.display = 'flex'; $('cover').classList.remove('gone');
    $('cf').textContent = 'The viewer could not start: ' + err.message;
  }
};
</script>
</body>
</html>
